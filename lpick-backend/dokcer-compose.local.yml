## 로컬에서 저희가 개발 시 사용될 docker-compose.local.yml입니다.
## 현재는 redis 실행만 담당하고있습니다.
version: "3.8"

services:

  redis:
    image: redis:7.2-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: always

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.3
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false   # 내부 통신은 http로 단순화
      - ES_JAVA_OPTS=-Xms512m -Xmx512m          # 메모리 상황에 맞게 조정
    command: [ "/bin/bash", "-c", "bin/elasticsearch-plugin install analysis-nori -b && /usr/local/bin/docker-entrypoint.sh" ]
    ulimits:
      memlock: { soft: -1, hard: -1 }
    volumes:
      - es_data:/usr/share/elasticsearch/data
    # 운영에서는 ES 포트 노출 금지(내부 전용) → ports 섹션 없음
    healthcheck: # 👈 최소 헬스체크 (패스워드 필요 없음)
      test: [ "CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 20

