spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/test_db
    username: testuser
    password: testpass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop   # 테스트에서만 테이블 자동 생성
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: never             # H2 + ddl-auto로 커버할 거면 never로 둬도 OK (원하면 always로 바꾸고 schema.sql 써도 됨)

# 테스트 중 필요한 더미 값들
  data:
    redis:
      host: localhost
      port: 6379

cookie:
  secure: false
  same-site: Lax

token:
  secret: test-test-test-test-test-test-test
