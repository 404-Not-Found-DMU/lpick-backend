## EC2 배포용 docker-compose.yml입니다. 개발시에는 사용하지 않습니다.
version: '3.8'

services:
  backend:
    image: junguijin/lpick-backend:latest
    container_name: lpick-backend
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_started
      elasticsearch:
        condition: service_healthy
    environment:
      # Spring Boot의 공식 바인딩 키
      - SPRING_ELASTICSEARCH_URIS=http://elasticsearch:9200
      # 그 외 DB/REDIS 등 기존 환경변수들...
      - SPRING_PROFILES_ACTIVE=prod
    volumes:
      - ./API-KEY.yml:/app/API-KEY.yml
      - /var/logs/lpick:/var/logs/lpick

  redis:
    image: redis:7.2-alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.3
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false   # 내부 통신은 http로 단순화
      - ES_JAVA_OPTS=-Xms512m -Xmx512m          # 메모리 상황에 맞게 조정
    command: ["/bin/bash", "-c", "bin/elasticsearch-plugin install analysis-nori -b && /usr/local/bin/docker-entrypoint.sh"]
    ulimits:
      memlock: { soft: -1, hard: -1 }
    volumes:
      - es_data:/usr/share/elasticsearch/data
    # 운영에서는 ES 포트 노출 금지(내부 전용) → ports 섹션 없음
    healthcheck: # 👈 최소 헬스체크 (패스워드 필요 없음)
      test: [ "CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 20

  logstash:
    image: docker.elastic.co/logstash/logstash:8.14.3
    container_name: logstash
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline
      - /var/logs/lpick:/var/logs/lpick
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - "5044:5044"

volumes:
  pgdata:
  es_data:
    driver: local
