## EC2 배포용 docker-compose.yml입니다. 개발시에는 사용하지 않습니다.
version: '3.8'

services:
  backend:
    image: junguijin/lpick-backend:latest
    container_name: lpick-backend
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
#      elasticsearch:
#        condition: service_healthy
    environment:
#      # Spring Boot의 공식 바인딩 키
#      - SPRING_ELASTICSEARCH_URIS=http://elasticsearch:9200
      # 그 외 DB/REDIS 등 기존 환경변수들...
      - SPRING_PROFILES_ACTIVE=prod
    volumes:
      - ./API-KEY.yml:/app/API-KEY.yml

  postgres:
    image: postgres:15
    container_name: postgres
    restart: always
    environment:
      POSTGRES_DB: lpick
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    depends_on:
      - backend

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    entrypoint: >
      sh -c "certbot certonly --webroot --webroot-path=/var/www/certbot
      --email yealkki38@gmail.com --agree-tos --no-eff-email
      -d lpick.duckdns.org"

