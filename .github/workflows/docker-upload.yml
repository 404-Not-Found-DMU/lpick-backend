name: 백엔드 도커 이미지 최신화

on:
  pull_request:
    branches: [ dev ]

concurrency:
  group: lpick-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: JDK 21 설치
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Gradle 캐시 + wrapper 검증 + 빌드 캐시 자동 세팅
      - name: Gradle 세팅(캐시)
        uses: gradle/actions/setup-gradle@v3

      - name: gradlew 실행 권한 부여
        working-directory: ./lpick-backend
        run: chmod +x gradlew

      - name: CI용 API-KEY.yml 생성
        working-directory: ./lpick-backend
        run: |
          mkdir -p src/main/resources
          echo "${{ secrets.API_KEY_CONTENT }}" > src/main/resources/API-KEY.yml

      - name: Gradle 빌드 (테스트 포함)
        working-directory: ./lpick-backend
        run: ./gradlew clean build -x test --build-cache

      - name: Docker Buildx 준비
        uses: docker/setup-buildx-action@v3

      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # BuildKit 캐시 사용 + tag 2개(latest, sha)
      - name: 이미지 빌드 & 푸시 (캐시 활용)
        uses: docker/build-push-action@v6
        with:
          context: ./lpick-backend
          file: ./lpick-backend/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            junguijin/lpick-backend:latest
            junguijin/lpick-backend:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: EC2 배포 (compose 파일은 서버에 고정)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/lpick-server/lpick-backend
            docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
            docker compose pull       # 서비스 이름에 맞춰 수정
            docker compose down
            docker compose up -d
            docker image prune -f
